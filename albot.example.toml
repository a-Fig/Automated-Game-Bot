# albot settings. Copy to albot.toml and change what you need; anything left out
# uses the default shown here. A misspelled setting name is an error at startup, not
# silently ignored.

window_title = "Albion Online Client"
dry_run = false            # true: decide and log, but send no keys or clicks

[models]
# Roboflow model ids. The keys come from environment variables, not this file:
#   set ROBOFLOW_KEY1=...   (Windows cmd)    $env:ROBOFLOW_KEY1="..."   (PowerShell)
scene = "albion_detector-l4o1a/5"
obstacles = "obstacle_instance_detection/5"
spells = "spell_detector/4"
loading_bar = "loading_bar/1"
health = "low_detector/1"
scene_key_env = "ROBOFLOW_KEY2"
obstacles_key_env = "ROBOFLOW_KEY2"
spells_key_env = "ROBOFLOW_KEY1"
loading_bar_key_env = "ROBOFLOW_KEY2"
health_key_env = "ROBOFLOW_KEY2"

[detection]
min_confidence = 0.65
min_obstacle_confidence = 0.5
class_confidence = {}      # per-class overrides, e.g. { silver = 0.55 }
mob_classes = ["mob"]
threat_classes = ["red"]
farm_classes = ["hide", "fiber"]
pickup_classes = ["silver", "cup of piss"]
wisp_classes = ["wisp caged"]
player_class = "player"
player_offset = [2, -95]   # usual player position relative to the window centre
close_range = 0.3          # "close" = within this fraction of the window height

[keys]
slots = ["q", "w", "e", "r", "d", "f"]   # action bar, left to right
food = "2"
stop = "s"                 # pressed before every click
close_menus = "esc"
attack_after_click = "space"
move_button = "right"
pause = "f8"               # global hotkeys for the bot itself
quit = "f9"
screenshot = "right shift"

[combat]
# openers are cast before engaging, if ready. The rotation casts the first ready
# step; the fallback is pressed when none are. Default: warbow.
openers = [{ slot = "r", delay = 0.5 }]
rotation = [{ slot = "e", delay = 0.5 }, { slot = "w", delay = 0.5 }]
fallback = { slot = "q", delay = 0.5 }
# longbow:     rotation = [{ slot = "w", delay = 0.5 }, { slot = "e", delay = 1.5 }]
# mistpiercer: rotation = [{ slot = "e", delay = 0.61 }, { slot = "w", delay = 0.5 }]
# nature:      rotation = [{ slot = "e", delay = 0.1 }, { slot = "w", delay = 0.3 }, { slot = "q", delay = 0.5, repeat = 3 }]
#              fallback = { slot = "q", delay = 0.5, repeat = 4 }
shield_slot = "d"
shield_wait = 2.5
leash_slot = "f"
leash_recast_after = 3.0    # legacy setting; ignored (Ethereal Path is a single dash)
escape_distance = 300.0    # cursor distance from the player, aimed away from nearby danger
heal_max_wait = 60.0
heal_settle = 5.0

[behavior]
# checked in this order every tick; the first that has something to do runs
priority = ["shield", "heal", "fight_close", "pickup", "farm", "fight_far", "eat", "wander"]
disabled = []              # e.g. ["farm"] to only fight
eat_every_minutes = 30.0
eat_wait = 2.0
pickup_wait = 2.0
wisp_wait = 5.5
farm_walk_timeout = 3.0
farm_max_seconds = 30.0
bored_ticks = 10
idle_sleep = 0.15
wander_range = 0.25
wander_min_distance = 0.15
wander_clicks = 4
wander_click_interval = 1.5
lost_seconds = 3.0         # nothing detected: esc after this, pause after twice this
stuck_repeats = 3          # failing at one spot this many times in a row...
stuck_radius = 40.0
blacklist_seconds = 15.0   # ...skips it for this long
resource_blacklist_seconds = 180.0  # one failed gather skips that approximate world spot
resource_blacklist_radius = 60.0    # pixel tolerance for movement-estimation drift
detours = true             # path around obstacles instead of skipping blocked targets
detour_margin = 25.0
walk_speed_px_per_s = 250.0   # a guess; tune by watching a detour walk
max_detour_walk = 2.5

[perception]
capture_backend = "mss"    # "pyautogui" is slower; it's what the original used
scene_workers = 2
status_hz = 5.0
stale_after = 2.0

[health]
# Window-relative HUD pixels, calibrated ONLY at 2240x1400 and the current UI scale.
# Recalibrate these rectangles AND window_size for other sizes/scales; no auto-scaling.
# Rectangles are [left, top, right, bottom], right/bottom exclusive.
window_size = [2240, 1400]
bar = [105, 56, 245, 68]
energy_bar = [105, 72, 245, 80]  # blue pixels distinguish zero health from a hidden HUD
low_threshold = 0.4
model_fallback = false     # use low_detector only when HUD unreadable; cannot detect death
# Without fallback, missing/unreadable HUD health suspends all actions until readable.
# If both bars are empty, health is unknown, not zero; respawn recognition is still needed.

[safety]
death_limit = 2            # quit after this many distinct deaths in the rolling window
death_window_seconds = 1800.0
zero_health = 0.01         # immediately treat a readable near-empty health bar as death
minimum_health = 0.05      # also count a death if health stays this low...
minimum_health_seconds = 3.0  # ...for this many seconds of fresh readings
recovery_health = 0.1      # re-arm only after health is at least this high...
recovery_seconds = 2.0     # ...continuously this long; no automatic respawn input
# Death records and exact triggering frames go to data.folder/deaths/.

[navigation]
# Map coordinates below are pixels relative to minimap_rect, NOT full-frame pixels.
zone = "fractured_ground"
assets_folder = "assets/zones"  # default resolved from repo root; custom paths from cwd
window_size = [2240, 1400]      # no automatic UI scaling
minimap_rect = [1840, 1040, 2240, 1400]
player_screen = [1125, 560]     # world-click origin; recalibrate for different UI sizes
calibrated = false             # task API refuses clicks until measured (dry-run can preview)
minimap_to_screen = [[1.0, 0.0], [0.0, 1.0]]  # screen_delta = matrix @ minimap_delta
map_speed_px_per_s = 6.0        # guess; nav-calibrate estimates from movement probes
arrow_min_value = 150          # correct BGR->HSV arrow hue is around 104, not around 10
arrow_min_saturation = 60      # recorded darkening reduces both value and saturation
arrow_min_mean_value = 170.0
arrow_min_dark_border = 0.3    # distinguishes the arrow from blue castle/rock pixels
clearance = 2.0                # minimap pixels around every wall
snap_radius = 8                # max distance to find a clear start/goal pixel
lookahead = 8.0                # minimap pixels along the next clear route segment
arrival_tolerance = 3.0
waypoint_tolerance = 2.0
click_min = 250.0              # screen pixels from player_screen
click_max = 400.0
safe_screen_rect = [400, 200, 1800, 1100]  # excludes HUD; never clamp x/y independently
stuck_seconds = 4.0            # no reduction in distance to the next waypoint
progress_pixels = 0.8          # ignore subpixel arrow jitter
side_step_seconds = 1.0        # one perpendicular click, then replan
stuck_block_radius = 3         # block intended stuck point in this task's private mask
max_replans = 3                # then stop proposing clicks, rather than loop forever

[data]
folder = "training_data"
sample_main = 200          # 1 in N ticks saves a screenshot; 0 = off
sample_bored = 20
sample_nothing_detected = 5

[debug]
view = false               # OpenCV window with detections and plans; use a second monitor
log_file = "albot.log"
log_level = "INFO"
